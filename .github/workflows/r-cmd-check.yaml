# Workflow derived from <https://github.com/r-lib/actions/tree/v2/examples>
# + Need help debugging build failures? Start at <https://github.com/r-lib/actions#where-to-find-help>

# Modification by @luciorq
# + Add ignored paths in the `.github` dir
# + Add CronJob to run every Sunday
# + Add `workflow_dispatch`
# + Add cancel on concurrency
# Check <https://github.com/luciorq/condathis/blob/main/.github/workflows/r-cmd-check.yaml> for the source of truth

# The articles are in `.Rbuildignore`, so the check builds no vignettes and
# + needs neither pandoc nor Quarto. No job compiles a dependency: macOS and
# + Windows get CRAN and Bioconductor binaries; on Ubuntu 26.04, R-release
# + takes both from the Posit Package Manager (pak's default Bioconductor
# + mirror is source only, `R_BIOC_MIRROR` points it to the binaries) and
# + R-devel, which Posit does not build for, takes both from the r-universe
# + binaries (Bioconductor devel, the branch that pairs with R-devel).
# + R-oldrel is off: no repository builds Linux binaries of its Bioconductor
# + release, and building them from source took over an hour.
---
on:
  push:
    branches: [main, master]
    paths:
      - '**'
      - '!.github/**'
      - '.github/workflows/r-cmd-check.yaml'

  pull_request:
    paths:
      - '**'
      - '!.github/**'
      - '.github/workflows/r-cmd-check.yaml'

  schedule:
    # Runs every Sunday at 01 AM ET - 5:00 UTC
    - cron: '0 5 * * 0'

  workflow_dispatch:

name: r-cmd-check

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  r-cmd-check:
    runs-on: ${{ matrix.config.os }}
    # Run the weekly cron only in the canonical repository, never in
    # + forks (pushes, PRs and manual dispatches still run everywhere).
    if: github.event_name != 'schedule' || github.repository == 'luciorq/isoformic'
    timeout-minutes: 60

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-latest,   r: 'release'}
          - {os: windows-latest, r: 'release'}
          - {os: ubuntu-26.04,   r: 'release'}
          - {os: ubuntu-26.04,   r: 'devel'}
          # - {os: ubuntu-26.04, r: 'oldrel-1'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          use-public-rspm: ${{ matrix.config.r != 'devel' }}

      # pak takes Bioconductor from a source-only mirror; Posit Package
      # + Manager serves Linux binaries of the same release.
      - name: Use the Bioconductor binaries of Posit Package Manager
        if: runner.os == 'Linux' && matrix.config.r == 'release'
        run: |
          . /etc/os-release
          echo "R_BIOC_MIRROR=https://packagemanager.posit.co/bioconductor/__linux__/${VERSION_CODENAME}/latest" >> "$GITHUB_ENV"

      # Only the r-universe binary repositories, for this distribution, R
      # + version and architecture; pak's own Bioconductor repositories are
      # + source only, so they are turned off.
      - name: Use the CRAN and Bioconductor binaries of r-universe
        if: runner.os == 'Linux' && matrix.config.r == 'devel'
        run: |
          . /etc/os-release
          r_version="$(Rscript -e 'cat(R.version$major, sub("[.].*$", "", R.version$minor), sep = ".")')"
          bin="bin/linux/${VERSION_CODENAME}-$(uname -m)/${r_version}"
          echo "options(repos = c(CRAN = 'https://cran.r-universe.dev/${bin}', BioC = 'https://bioc.r-universe.dev/${bin}'))" >> "$HOME/.Rprofile"
          echo "PKG_USE_BIOCONDUCTOR=false" >> "$GITHUB_ENV"
          Rscript -e 'print(getOption("repos"))'

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual")'

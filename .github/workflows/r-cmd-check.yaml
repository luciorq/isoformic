# Workflow derived from <https://github.com/r-lib/actions/tree/v2/examples>
# + Need help debugging build failures? Start at <https://github.com/r-lib/actions#where-to-find-help>

# Modification by @luciorq
# + Add ignored paths in the `.github` dir
# + Add CronJob to run every Sunday
# + Add `workflow_dispatch`
# + Add cancel on concurrency
# Check <https://github.com/luciorq/condathis/blob/main/.github/workflows/r-cmd-check.yaml> for the source of truth

# The articles are in `.Rbuildignore`, so the check builds no vignettes and
# + needs neither pandoc nor Quarto. R-devel and R-oldrel install only the
# + hard dependencies: their Bioconductor Suggests have no binaries and took
# + over an hour to build from source. Every example and test that needs a
# + Suggests package skips without it.
---
on:
  push:
    branches: [main, master]
    paths:
      - '**'
      - '!.github/**'
      - '.github/workflows/r-cmd-check.yaml'

  pull_request:
    paths:
      - '**'
      - '!.github/**'
      - '.github/workflows/r-cmd-check.yaml'

  schedule:
    # Runs every Sunday at 01 AM ET - 5:00 UTC
    - cron: '0 5 * * 0'

  workflow_dispatch:

name: r-cmd-check

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  r-cmd-check:
    runs-on: ${{ matrix.config.os }}
    # Run the weekly cron only in the canonical repository, never in
    # + forks (pushes, PRs and manual dispatches still run everywhere).
    if: github.event_name != 'schedule' || github.repository == 'luciorq/isoformic'
    timeout-minutes: 60

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-latest,   r: 'release'}
          - {os: windows-latest, r: 'release'}
          - {os: ubuntu-latest,  r: 'release'}
          - {os: ubuntu-latest,  r: 'devel', http-user-agent: 'release', dependencies: '"hard"'}
          - {os: ubuntu-latest,  r: 'oldrel-1', dependencies: '"hard"'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      _R_CHECK_FORCE_SUGGESTS_: ${{ matrix.config.dependencies == '"hard"' && 'false' || 'true' }}

    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: ${{ matrix.config.dependencies || '"all"' }}
          # The light Suggests run their tests on every R version.
          extra-packages: >-
            any::rcmdcheck, any::testthat, any::knitr, any::curl,
            any::readxl, any::writexl, any::condathis, any::patchwork
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual")'

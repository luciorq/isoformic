# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
---
on:
  push:
    branches: [main, master]
    paths:
      - '**'
      - '!.github/**'
      - '.github/workflows/test-coverage.yaml'
  pull_request:
    paths:
      - '**'
      - '!.github/**'
      - '.github/workflows/test-coverage.yaml'
  workflow_dispatch:

name: test-coverage

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-coverage:
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      # pak takes Bioconductor from a source-only mirror; Posit Package
      # + Manager serves Linux binaries of the same release.
      - name: Use the Bioconductor binaries of Posit Package Manager
        run: |
          . /etc/os-release
          echo "R_BIOC_MIRROR=https://packagemanager.posit.co/bioconductor/__linux__/${VERSION_CODENAME}/latest" >> "$GITHUB_ENV"

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::covr, any::xml2
          needs: coverage

      - name: Test coverage
        run: |
          cov <- covr::package_coverage(
            quiet = FALSE,
            clean = FALSE,
            install_path = file.path(normalizePath(Sys.getenv("RUNNER_TEMP"), winslash = "/"), "package")
          )
          print(cov)
          covr::to_cobertura(cov)
        shell: Rscript {0}

      - uses: codecov/codecov-action@v7
        with:
          fail_ci_if_error: ${{ github.event_name != 'pull_request' && true || false }}
          files: ./cobertura.xml
          plugins: noop
          disable_search: true
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Show testthat output
        if: always()
        run: |
          find '${{ runner.temp }}/package' -name 'testthat.Rout*' -exec cat '{}' \; || true
        shell: bash

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-test-failures
          path: ${{ runner.temp }}/package

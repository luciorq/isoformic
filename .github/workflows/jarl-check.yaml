# Lint R sources with jarl <https://jarl.etiennebacher.com>; rules are set in
# `jarl.toml` at the repository root.
---
on:
  push:
    branches: [main, master]
    paths:
      - 'R/**'
      - 'tests/**'
      - 'data-raw/**'
      - 'jarl.toml'
      - '.github/workflows/jarl-check.yaml'
  pull_request:
    paths:
      - 'R/**'
      - 'tests/**'
      - 'data-raw/**'
      - 'jarl.toml'
      - '.github/workflows/jarl-check.yaml'
  workflow_dispatch:

name: jarl-check

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  jarl-check:
    name: jarl-check
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # The package-specific rules (DPLYR, ...) resolve function origins
      # + through R and the installed imports.
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'

      - uses: etiennebacher/setup-jarl@v0.1.1
        with:
          args: check
          src: .

# Lint R sources with jarl <https://jarl.etiennebacher.com>; rules are set in
# `jarl.toml` at the repository root.
---
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

name: jarl-check

permissions: read-all

jobs:
  jarl-check:
    name: jarl-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The package-specific rules (DPLYR, ...) resolve function origins
      # through R and the installed dependencies.
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2

      - uses: etiennebacher/setup-jarl@v0.1.1
        with:
          args: check
          src: .

# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help

# Pushes and pull requests build the site in the fast mode: the articles that
# + download and parse GENCODE show their code without running it. Releases,
# + the weekly schedule and manual dispatches (`full`, on by default) set
# + `ISOFORMIC_FULL=true`, run every article and are the only builds that
# + deploy, so the published site always has the full output.
---
on:
  push:
    branches: [main, master]
    paths:
      - '**'
      - '!.github/**'
      - '.github/workflows/pkgdown.yaml'

  pull_request:
    branches: [main, master]
    paths:
      - '**'
      - '!.github/**'
      - '.github/workflows/pkgdown.yaml'

  release:
    types: [published]

  schedule:
    # Runs every Sunday at 02 AM ET - 6:00 UTC
    - cron: '0 6 * * 0'

  workflow_dispatch:
    inputs:
      full:
        description: 'Run every article (ISOFORMIC_FULL=true) and deploy'
        type: boolean
        default: true

name: pkgdown

permissions: read-all

jobs:
  pkgdown:
    runs-on: ubuntu-26.04
    if: github.event_name != 'schedule' || github.repository == 'luciorq/isoformic'
    timeout-minutes: 120
    # Only restrict concurrency for non-PR jobs
    concurrency:
      group: pkgdown-${{ github.event_name != 'pull_request' || github.run_id }}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      ISOFORMIC_FULL: ${{ (github.event_name == 'release' || github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.full)) && 'true' || 'false' }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: quarto-dev/quarto-actions/setup@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      # pak takes Bioconductor from a source-only mirror; Posit Package
      # + Manager serves Linux binaries of the same release.
      - name: Use the Bioconductor binaries of Posit Package Manager
        run: |
          . /etc/os-release
          echo "R_BIOC_MIRROR=https://packagemanager.posit.co/bioconductor/__linux__/${VERSION_CODENAME}/latest" >> "$GITHUB_ENV"

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgdown, local::.
          needs: website

      # GENCODE and the annotation built from it land in the package cache;
      # + keep them between the full builds.
      - name: Cache the isoformic downloads
        if: env.ISOFORMIC_FULL == 'true'
        uses: actions/cache@v6
        with:
          path: ~/.cache/R/isoformic
          key: isoformic-cache-${{ runner.os }}-gencode-v33

      - name: Build site
        run: pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)
        shell: Rscript {0}

      - name: Deploy to GitHub pages
        if: github.event_name != 'pull_request' && env.ISOFORMIC_FULL == 'true'
        uses: JamesIves/github-pages-deploy-action@v4.9.0
        with:
          clean: false
          branch: gh-pages
          folder: docs
